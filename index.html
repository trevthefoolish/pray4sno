<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>pray4sno: winter park snow forecast</title>
<link rel="stylesheet" href="site.css">
<style>
  .wrap { max-width: min(100%, calc(40ch + 32px)); }
  .days { overflow-x: auto; }
  table { border-collapse: collapse; }
  th, td { text-align: left; white-space: nowrap; vertical-align: top; padding: 0 2ch 0.25em 0; }
  th:last-child, td:last-child { padding-right: 0; }
  thead th { padding-bottom: 0.75em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main class="wrap">
  <h1>pray4sno: winter park</h1>
  <div class="days" hidden><table>
    <thead><tr><th><span class="sr">day</span></th><th>peak<br>12,000 ft</th><th>village<br>9,100 ft</th></tr></thead>
    <tbody></tbody>
  </table></div>
  <p id="note">loading...</p>
</main>
<a class="corner" href="stats.html" aria-label="stats: how the forecast is doing"><span>i</span></a>
<script>
const API = "https://customer-api.open-meteo.com/v1/forecast";
const KEY = "bSvD5raxPiFWRcz4";
const POINTS = ["peak", "base"];                       // the table's columns; the base is the village
const DAYS = 7;

// Hour ending t (UTC) belongs to the window ending at the first 15:00 UTC (08:00 MST) at or after t.
function windowEnd(t) {
  const d = new Date(t);
  if (d.getUTCHours() * 60 + d.getUTCMinutes() > 15 * 60) d.setUTCDate(d.getUTCDate() + 1);
  d.setUTCHours(15, 0, 0, 0);
  return d.getTime();
}

// Same formula as calibrate.py: per model, liquid = a * cold + b * cold liquid, where cold hours are at or below
// cal.snow_c. The mean of the models picks the bin whose past days give the odds of 1"+ and the snow's range.
function forecast(cal, loc, point, ends) {
  const hours = {};                                    // model -> window end -> [[mm, cold?] per hour]
  for (const model in cal.models) {
    hours[model] = {};
    loc.hourly.time.forEach((t, i) => {
      const p = loc.hourly[`precipitation_${cal.models[model]}`][i];
      const c = loc.hourly[`temperature_2m_${cal.models[model]}`][i];
      if (p !== null && c !== null) (hours[model][windowEnd(t + "Z")] ||= []).push([p, c <= cal.snow_c]);
    });
  }
  return ends.map((end, k) => {
    const members = Object.keys(cal.models)
      .filter(m => hours[m][end]?.length === 24)
      .map(m => {
        const [a, b] = cal.coef[point][m][k];
        const h = hours[m][end];
        const cold = h.filter(([, c]) => c).length / 24;
        const coldLiquid = h.reduce((s, [p, c]) => s + (c ? p : 0), 0) / 25.4;
        return Math.max(0, a * cold + b * coldLiquid);
      });
    if (!members.length) return null;
    const liq = members.reduce((s, x) => s + x, 0) / members.length;
    const g = cal.leads[k + 1], bin = cal.bins.filter(e => liq >= e).length;
    return { odds: cal.odds[point][g][bin], range: cal.range[point][g][bin] };
  });
}

// `2-6" 30%`; blank when the odds round to 0%.
function cell(d) {
  if (d === null) return "-";
  const pct = Math.round(d.odds * 10) * 10;
  const [lo, hi] = d.range.map(Math.round);
  return pct ? `${lo === hi ? lo : `${lo}-${hi}`}" ${pct}%` : "";
}

async function main() {
  const cal = await (await fetch("calibration.json")).json();
  const url = `${API}?latitude=${POINTS.map(p => cal.points[p][0])}&longitude=${POINTS.map(p => cal.points[p][1])}` +
    `&hourly=precipitation,temperature_2m&models=${Object.values(cal.models)}&past_days=1&forecast_days=9&timezone=GMT&apikey=${KEY}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`forecast service returned ${res.status}`);
  const locs = await res.json();

  const first = windowEnd(new Date(Date.now() + 60000).toISOString());   // next 8 AM report
  const ends = Array.from({ length: DAYS }, (_, k) => first + k * 86400000);
  const cols = POINTS.map((p, i) => forecast(cal, locs[i], p, ends));
  const fmt = new Intl.DateTimeFormat("en-US", { weekday: "short", month: "numeric", day: "numeric", timeZone: "America/Denver" });
  const day = e => fmt.format(e).toLowerCase().replace(",", "");
  const rows = ends.map((e, k) => [day(e), ...cols.map(c => cell(c[k]))]).filter(([, ...cells]) => cells.some(Boolean));
  const note = document.getElementById("note");
  if (!rows.length) { note.textContent = `no sno in sight through ${day(ends[DAYS - 1])}.`; return; }
  document.querySelector("tbody").innerHTML = rows.map(([d, ...cells]) =>
    `<tr><th scope="row">${d}</th>${cells.map(c => `<td>${c}</td>`).join("")}</tr>`).join("");
  document.querySelector(".days").hidden = false;
  note.hidden = true;
}

main().catch(e => { document.getElementById("note").textContent = `forecast unavailable: ${e.message.toLowerCase()}`; });
</script>
</body>
</html>
